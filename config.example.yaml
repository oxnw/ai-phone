# ai-phone configuration (copy to ~/.ai-phone/config.yaml, chmod 600). Full schema: architecture.md §8, §14a and §14b.
# Lines are usually added for you by `ai-phone lines add …`. This is an excerpt, not the whole schema: it shows the
# fields you normally set, and omits the ones that have a working default. Notably absent from the line entries below:
# transport, register_via_proxy, outbound_proxy, register_expiry_sec, srtp, diverted_from, verified_caller_ids and the
# provider block `lines add` writes; also models.home, the brain timeouts, and most of conversation: and log:.
# §14a.1 lists every line field with its default.
sip:
  bind: {address: 0.0.0.0, udp_port: 5060, tcp_port: 5060, tls_port: 5061}
  tls: {cert_file: null, key_file: null, ca_file: null}   # ca_file null = the certifi bundle
  public_addr: null          # set when you have a fixed public address; otherwise leave null
  stun_server: null          # host:port; contacted at daemon start only, and only when public_addr is null
  nameservers: []            # empty = read /etc/resolv.conf (needed for SRV lookups of the registrar)
  tcp_keepalive_sec: 30

lines:
  main:                                   # a real phone number on a carrier (Telnyx shown; `ai-phone lines add telnyx` writes this)
    kind: trunk
    number: "+442079460000"
    display_name: "Sam's assistant"
    registrar: "sip:sip.telnyx.com"
    dial_domain: "sip.telnyx.com"
    user: "aimain7f3a"
    password_env: AI_PHONE_LINE_MAIN_PASSWORD   # the password itself lives in ~/.ai-phone/secrets.env
    accept_invites_from: registered_trunk       # registered_trunk | trusted | lan | any
    trusted_cidrs: []                           # the carrier's signalling ranges; written by the provider
    caller_id: "+442079460000"
    from_user: number                         # number (default) | account; account uses the SIP username in From
                                              # SignalWire uses account and its endpoint send_as for the displayed number
    tls_hostname_policy: strict             # strict (default) | verified_wildcard
                                            # verified_wildcard requires a TLS trunk, register_via_proxy: true and
                                            # outbound_proxy: "sip:DNS-host[:port];transport=tls". See docs/signalwire.md.
  agents:                                 # a SIP address with no carrier (agents calling agents)
    kind: sip
    user: agents
    aor: "sip:agents@home.example.org"
    display_name: agents
    accept_invites_from: trusted
    trusted_peers: ["203.0.113.7"]
    caller_id: "sip:agents@home.example.org"

inbound:                       # incoming calls: every caller hears the greeting; the model follows the instructions
                               # when no AI is waiting in `ai-phone listen`
  greeting: "Hi, you've reached an AI assistant. How can I help?"
  instructions: "Take a message: ask for the caller's name, number and what it is about."

calls:
  allow_inbound: true          # receive calls; ai-phone must stay running while you want to be reachable
  allow_outbound: true         # place calls; at least one direction must be enabled
  daily_limit: 0               # outbound calls per local day; 0 = no limit
  relay_filler_after_ms: 1500  # relay mode: say "One moment." after this long without a reply from your AI
  relay_second_filler_sec: 10  # and "Still with you, one moment." at this many seconds
  relay_reply_timeout_sec: 25  # then apologise and hang up

rtp:
  port_min: 10000
  port_max: 10100
models:
  tier: auto                 # auto (t9 with 32 GB or more, else t4), a model from the catalog in models.py —
                             # t4 | t9 | qwen2b | llama3b | gemma4b | mistral7b | gemma12b — or any
                             # mlx-lm 4-bit repo id, like "org/name"
  wire_memory: true          # ask MLX to keep the model weights resident (macOS 15+)
  keep_warm_sec: 30          # idle workers run one tiny inference this often, so on a crowded host macOS compresses
                             # something else first and the first reply after a quiet spell is not seconds late. 0 = off

brain:
  kind: local                # local | openai_compatible (any /v1/chat/completions server: LM Studio, llama.cpp, your own
                             # agent) | claude | chatgpt (the plan you already pay for, through the CLI you are logged
                             # into: no API key, and the plan's own limits apply)
  base_url: "http://127.0.0.1:1234/v1"   # openai_compatible only; https unless it is on this machine
  model: "local"             # the endpoint's model name; for claude haiku | sonnet | opus (default haiku), for chatgpt
                             # a model the plan lists (default gpt-5.6-luna, the fastest measured on a call)
  cli: null                  # claude / chatgpt: where that CLI is; null = look for `claude` or `codex` on PATH
  # first_token_timeout_ms defaults to 4000, which is for a model on this Mac: the daemon gives a subscription brain
  # 12000 unless you set a number here yourself (its first word takes seconds — its CLI starts, then the provider).

tts:
  engine: kokoro    # kokoro (also the default for existing configs) | phonon
  voice: af_heart   # Kokoro: af_/am_ American, bf_/bm_ British; Phonon: default
  speed: 1.0        # Kokoro: 0.5 to 2.0; Phonon: 1.0 only

conversation:
  endpoint_silence_ms: 300
  reply_timeout_sec: 12      # no audible reply this long after the caller stops: apologise and listen again (a stalled
                             # model). A subscription brain also takes a third of this as the longest it will wait for
                             # a turn the caller talked over to finish (Claude Code cannot be interrupted)
log:
  dir: "~/Library/Logs/ai-phone"
